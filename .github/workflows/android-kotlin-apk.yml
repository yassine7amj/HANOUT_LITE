name: بناء تطبيق أندرويد أصلي (Kotlin)

# ============================================================
# تطبيق أندرويد أصلي (Kotlin + Jetpack Compose) لكل حانوت.
#
# كيفاش كتخدم:
#   1) GitHub → Actions → «بناء تطبيق أندرويد أصلي (Kotlin)» → Run workflow
#   2) عمّر:
#        • app_name     : الاسم اللي كيبان تحت الأيقونة
#        • shop         : slug الحانوت (بحال hanout-nakhil) — كيتقرا منو
#                         merchants/{slug} و merchants/{slug}/data/catalog
#                         فـ Firestore
#        • package_id   : معرّف الحزمة، خاص يبقى ثابت لكل تحديثات نفس الحانوت
#        • fb_project_id / fb_api_key : إعدادات Firebase (كتّقرا من
#                         Project settings → Your apps → Web app)
#        • web_base     : رابط النسخة الويب (خاوي = كيتولّد أوتوماتيكيا)
#   3) ملي يسالي، حمّل الـ APK من Artifacts ولا من Releases.
#
# ملاحظة: المفاتيح ديال Firebase Web (apiKey) ماشي سرّية — كتبان فالويب
#         عادي، لكن الحماية كتجي من قواعد أمان Firestore.
#
# مفتاح التوقيع (keystore): بحال workflow الـ TWA —
#   • بلا أسرار: كيتولّد مفتاح تجريبي فكل بناء (صالح للتجريب فقط).
#   • للإنتاج: ANDROID_KEYSTORE_BASE64 + KEYSTORE_PASSWORD + KEY_PASSWORD + KEY_ALIAS
# ============================================================

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'اسم التطبيق (كيظهر تحت الأيقونة)'
        required: true
        default: 'HANOUT LITE'
      shop:
        description: 'slug الحانوت (مثال: hanout-nakhil)'
        required: false
        default: ''
      package_id:
        description: 'معرّف الحزمة (مثال: ma.hanout.nakhil) — خاويه = ma.hanout.lite'
        required: false
        default: ''
      fb_project_id:
        description: 'Firebase projectId (خاوي = التطبيق كيخدم فوض تجريبي)'
        required: false
        default: ''
      fb_api_key:
        description: 'Firebase Web API key (خاوي = وض تجريبي)'
        required: false
        default: ''
      web_base:
        description: 'رابط النسخة الويب — خاوي = كيتولّد من إعدادات المستودع'
        required: false
        default: ''
      version_name:
        description: 'رقم الإصدار (versionName)'
        required: false
        default: '1.0'
      version_code:
        description: 'كود الإصدار (versionCode)'
        required: false
        default: '1'

permissions:
  contents: write

concurrency:
  group: kotlin-apk-${{ github.event.inputs.shop || 'platform' }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تهيئة Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تهيئة Android SDK
        # كنعتمدو على Android SDK المثبّت أصلاً فالـ runner (ما كنستعملوش
        # android-actions/setup-android حيت كيحاول يثبّت حزمة 'tools' اللي
        # ما بقاتش فـ cmdline-tools الجديدة وكتفشّل البناء).
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            for c in /usr/local/lib/android/sdk /opt/android-sdk "$HOME/Android/Sdk"; do
              if [ -d "$c" ]; then SDK="$c"; break; fi
            done
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n1)"
          fi
          if [ -n "$SDKMGR" ] && [ -x "$SDKMGR" ]; then
            echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --install "platform-tools" "platforms;android-35" \
              "build-tools;35.0.0" > /dev/null 2>&1 || true
            echo "✔ sdkmanager: $SDKMGR"
          else
            echo "⚠ ما لقيناش sdkmanager — الـ runner غالباً فيه SDK مقاد"
          fi

          echo "SDK=$SDK"
          ls -1 "$SDK/platforms" 2>/dev/null || true

      - name: تهيئة Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: تحديد رابط الويب
        id: cfg
        run: |
          if [ -n "${{ github.event.inputs.web_base }}" ]; then
            echo "web_base=${{ github.event.inputs.web_base }}" >> "$GITHUB_OUTPUT"
          else
            echo "web_base=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: تحضير مفتاح التوقيع
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'hanout-lite-dev' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'android' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "✔ استرجعنا مفتاح التوقيع من الأسرار"
          else
            keytool -genkeypair -v -keystore release.keystore -storetype PKCS12 \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=HANOUT LITE, OU=Apps, O=HANOUT, L=Casablanca, C=MA"
            echo "⚠ تولّد مفتاح تجريبي جديد — للإنتاج زيد ANDROID_KEYSTORE_BASE64"
          fi
          echo "ANDROID_KEYSTORE_PATH=$PWD/release.keystore" >> "$GITHUB_ENV"

      - name: بناء APK + AAB (Gradle)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'hanout-lite-dev' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || 'hanout-lite-dev' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'android' }}
          IN_APP_NAME: ${{ github.event.inputs.app_name }}
          IN_SHOP: ${{ github.event.inputs.shop }}
          IN_PACKAGE: ${{ github.event.inputs.package_id }}
          IN_FB_PROJECT: ${{ github.event.inputs.fb_project_id }}
          IN_FB_KEY: ${{ github.event.inputs.fb_api_key }}
          IN_WEB_BASE: ${{ steps.cfg.outputs.web_base }}
          IN_VERSION_NAME: ${{ github.event.inputs.version_name }}
          IN_VERSION_CODE: ${{ github.event.inputs.version_code }}
        run: |
          gradle --no-daemon --stacktrace assembleRelease bundleRelease \
            -PappLabel="$IN_APP_NAME" \
            -Pshop="$IN_SHOP" \
            -PappPackage="$IN_PACKAGE" \
            -PfbProjectId="$IN_FB_PROJECT" \
            -PfbApiKey="$IN_FB_KEY" \
            -PwebBase="$IN_WEB_BASE" \
            -PversionName="$IN_VERSION_NAME" \
            -PversionCode="$IN_VERSION_CODE"

      - name: رفع APK/AAB كأرتيفاكت
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-apk-${{ github.event.inputs.shop || 'platform' }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: إنشاء Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kotlin-${{ github.event.inputs.shop || 'platform' }}-${{ github.run_number }}
          name: "${{ github.event.inputs.app_name }} (Kotlin) — إصدار ${{ github.run_number }}"
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          body: |
            **التطبيق:** ${{ github.event.inputs.app_name }} (نسخة Kotlin أصلية)
            **الحانوت:** `${{ github.event.inputs.shop || '(غير محدّد)' }}`
            **الحزمة:** `${{ github.event.inputs.package_id || 'ma.hanout.lite' }}`
            **النسخة الويب:** ${{ steps.cfg.outputs.web_base }}

            حمّل `app-release.apk` وثبّتو فالتيليفون (خاصك تسمح بـ«تثبيت من مصادر غير معروفة»).
