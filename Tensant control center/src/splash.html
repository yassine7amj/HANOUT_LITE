<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>TENSANTS GROUP</title>
  <link rel="stylesheet" href="styles/splash.css" />
</head>
<body>
  <div class="stage">
    <div class="card" id="card">
      <div class="card__aura"></div>

      <!-- animated gold arc drawn around the emblem -->
      <svg class="ring" viewBox="0 0 240 240" aria-hidden="true">
        <circle class="ring__track" cx="120" cy="120" r="104" />
        <circle class="ring__arc"  cx="120" cy="120" r="104" id="arc" />
        <circle class="ring__head" cx="120" cy="16" r="4.5" id="arcHead" />
      </svg>

      <div class="emblem" id="emblem">
        <img src="../assets/logo.png" alt="TENSANTS GROUP" id="logo" draggable="false" />
        <div class="emblem__glow"></div>
        <div class="emblem__shine"></div>
      </div>

      <div class="wordmark" id="wordmark" aria-label="Control Center">
        <span class="wordmark__main">CONTROL</span>
        <span class="wordmark__sub">CENTER</span>
      </div>

      <div class="tagline" id="tagline">
        <span>Enterprise Administration &amp; System Control</span>
      </div>

      <div class="progress" id="progressWrap">
        <div class="progress__track">
          <div class="progress__fill" id="progressFill"></div>
        </div>
        <div class="progress__meta">
          <span id="status">Initializing secure session</span>
          <span id="percent">0%</span>
        </div>
      </div>

      <div class="footer">TENSANTS GROUP CONTROL CENTER · v0.1.0</div>
    </div>
  </div>

  <script src="js/spring.js"></script>
  <script src="js/splash.js"></script>
</body>
</html>
